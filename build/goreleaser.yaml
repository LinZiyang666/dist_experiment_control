# goreleaser config for tether v1 (architecture K.4).
#
# Each Linux archive ships tether and both infrastructure support executables;
# Darwin archives keep tether. Both use one install.sh and SHA256SUMS manifest.
# The install.sh entry covers all three roles
# (agent / ctl / broker); architecture K.4 makes the case for "one
# tarball per platform, one script" over six packages plus three
# scripts.
#
# Run locally:   goreleaser release --snapshot --clean
# CI:            triggered on git tag push; uploads to GitHub Releases.
version: 2

project_name: tether

before:
  hooks:
    - go mod tidy
    # Pre-generate zsh completion once and ship it in every tarball
    # under completions/_tether. install.sh extracts it and drops into
    # an fpath dir; doing it here keeps install.sh from invoking the
    # tether binary (K.0 §2 / test/p10/install_sh_test.go forbids that).
    #
    # Generated into ./completions/ (not dist/) — goreleaser's
    # "ensuring distribution directory" step refuses to start if dist
    # is non-empty, so before-hooks must write somewhere else. The
    # output dir is .gitignore'd.
    - sh -c 'mkdir -p completions && go run ./cmd/tether completion zsh > completions/_tether'

builds:
  - id: tether
    main: ./cmd/tether
    binary: tether
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # ReleaseVersion is read by `tether version` and stamped into
      # every audit envelope as actor metadata.
      - -s -w -X github.com/LinZiyang666/tether/internal/proto.ReleaseVersion={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  # origin: hot-update S9 plan §6.5 / T55. Separate archive groups keep
  # Linux support out of Darwin without relaxing the binary-count check.
  - id: tether-darwin
    main: ./cmd/tether
    binary: tether
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/LinZiyang666/tether/internal/proto.ReleaseVersion={{ .Version }}
    goos: [darwin]
    goarch: [amd64, arm64]
  - id: tether-infra-helper
    main: ./cmd/tether-infra-helper
    binary: tether-infra-helper
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux]
    goarch: [amd64, arm64]
    # origin: S9 internal review rv-priv F2. The last completed support build
    # writes one manifest from both actual platform outputs.
    hooks:
      post:
        - python3 -I -B build/infra-support.py --root . --release v{{ .Version }} --goos {{ .Os }} --goarch {{ .Arch }} --binary {{ .Path }}
  - id: tether-infra-launch
    main: ./cmd/tether-infra-launch
    binary: tether-infra-launch
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux]
    goarch: [amd64, arm64]
    # origin: S9 internal review rv-priv F2. The last completed support build
    # writes one manifest from both actual platform outputs.
    hooks:
      post:
        - python3 -I -B build/infra-support.py --root . --release v{{ .Version }} --goos {{ .Os }} --goarch {{ .Arch }} --binary {{ .Path }}

archives:
  - id: tether-linux
    ids: [tether, tether-infra-helper, tether-infra-launch]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - src: completions/_tether
        dst: completions/_tether
      - src: "dist/infra-support/{{ .Os }}_{{ .Arch }}/infra-catalog.json"
        dst: infra-catalog.json
        info:
          mode: 0644
      - src: "dist/infra-support/{{ .Os }}_{{ .Arch }}/infra-support.manifest"
        dst: infra-support.manifest
        info:
          mode: 0644
  - id: tether-darwin
    ids: [tether-darwin]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - src: completions/_tether
        dst: completions/_tether

# install.sh ships alongside the per-platform tarballs as an
# "extra_file". Operators curl install.sh and pass the tarball URL
# as --source-base; install.sh fetches the right per-platform
# tarball + verifies SHA256SUMS.
release:
  extra_files:
    - glob: scripts/install.sh

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
